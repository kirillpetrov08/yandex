# --- Gradle ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.9 официально "знает" про SDK 35; SDK 36 используется для требований Google Play 2026.
android.suppressUnsupportedCompileSdk=36

# --- Kotlin ---
kotlin.code.style=official

# --- Приложение: меняется в одном месте ---
# ВАЖНО: applicationId нельзя изменить после первой публикации в Google Play.
app.applicationId=com.blockpuzzle.app
# Имя в лаунчере задаётся в strings.xml (values/ и values-ru/) — эти строки справочные,
# для документации; в Google Play имя может быть длиннее (до 30 символов).
app.appNameRu=Блоки — головоломка
app.appNameEn=Blocks — Block Puzzle
app.versionCode=2
app.versionName=1.0.1
app.minSdk=24
app.targetSdk=36
app.compileSdk=36

# --- Реклама РСЯ (Монетизация) ---
# Реальные блоки приложения «Блоки — головоломка» (РСЯ, приложение 20230567).
# testMode=false: демо-блоков больше нет, показы идут через реальные блоки РСЯ.
ads.testMode=false
ads.bannerUnitId=R-M-20230567-1
ads.interstitialUnitId=R-M-20230567-2
ads.rewardedUnitId=R-M-20230567-3
ads.appOpenUnitId=R-M-20230567-4
ads.nativeUnitId=R-M-20230567-5
# Тестовая сборка (assembleDebug) по умолчанию остаётся на демо-блоках: смотреть и тем более
# нажимать свою рекламу на своём телефоне опасно — РСЯ блокирует аккаунт за такие клики.
# Если нужно проверить реальные блоки именно в debug-сборке — поставьте false.
ads.debugUseDemoIds=true

# --- Частотные политики рекламы (можно менять без правки кода) ---
# Интерстишл: показывать не чаще, чем раз в N секунд (60 = безопасно)
ads.interstitialIntervalSeconds=60
# Интерстишл: каждый N-й проигрыш (2 = каждый второй, 1 = каждый)
ads.interstitialGamesInterval=2
# App Open: не чаще одного показа раз в N часов (4 = безопасно)
ads.appOpenIntervalHours=4

# Focus — ID is supplied by the developer from the Yandex Ads dashboard.
# An empty ID disables ads; never publish with a demo or another app's ID.
focus.applicationId=com.ayaks.focus
focus.versionCode=1
focus.versionName=1.0.0
focus.minSdk=23
focus.targetSdk=36
focus.compileSdk=36
focus.bannerUnitId=
