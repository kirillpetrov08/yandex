# --- Gradle ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.9 официально "знает" про SDK 35; SDK 36 используется для требований Google Play 2026.
android.suppressUnsupportedCompileSdk=36

# --- Kotlin ---
kotlin.code.style=official

# --- Приложение: меняется в одном месте ---
# ВАЖНО: applicationId нельзя изменить после первой публикации в Google Play.
app.applicationId=com.blockpuzzle.app
# Имя в лаунчере задаётся в strings.xml (values/ и values-ru/) — эти строки справочные,
# для документации; в Google Play имя может быть длиннее (до 30 символов).
app.appNameRu=Блоки — головоломка
app.appNameEn=Blocks — Block Puzzle
app.versionCode=1
app.versionName=1.0.0
app.minSdk=24
app.targetSdk=36
app.compileSdk=36

# --- Реклама РСЯ (Монетизация) ---
# Пока true — используются демонстрационные блоки Яндекса (тестовые креативы).
# Перед релизом: получите в интерфейсе РСЯ реальные ID блоков вида R-M-XXXXXXX-Y,
# впишите их ниже и поставьте ads.testMode=false.
ads.testMode=true
ads.bannerUnitId=demo-banner-yandex
ads.interstitialUnitId=demo-interstitial-yandex
ads.rewardedUnitId=demo-rewarded-yandex
ads.appOpenUnitId=demo-appopenad-yandex
ads.nativeUnitId=demo-native-content-yandex

# --- Частотные политики рекламы (можно менять без правки кода) ---
# Интерстишл: показывать не чаще, чем раз в N секунд (60 = безопасно)
ads.interstitialIntervalSeconds=60
# Интерстишл: каждый N-й проигрыш (2 = каждый второй, 1 = каждый)
ads.interstitialGamesInterval=2
# App Open: не чаще одного показа раз в N часов (4 = безопасно)
ads.appOpenIntervalHours=4
